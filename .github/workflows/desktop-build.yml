name: Desktop build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm.cmd ci
          npm.cmd --prefix frontend ci
          python -m pip install -r backend/requirements-build.txt

      - name: Test Python service
        run: python -m unittest backend.test_app

      - name: Build sidecar and icons
        run: |
          npm.cmd run sidecar:windows
          npm.cmd run tauri icon frontend/public/favicon.svg

      - name: Build installer
        run: npm.cmd run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: Colemak-DH-Tutor-Windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux-flatpak:
    name: Linux Flatpak repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          python -m pip install -r backend/requirements-build.txt

      - name: Test Python service
        run: python -m unittest backend.test_app

      - name: Build sidecar, icons, and Debian staging package
        run: |
          chmod +x scripts/build-sidecar.sh packaging/flatpak/build-flatpak.sh
          ./scripts/build-sidecar.sh
          npm run tauri icon frontend/public/favicon.svg
          npm run tauri build -- --bundles deb

      - name: Build Flatpak bundle and repository
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
          deb_path=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          ./packaging/flatpak/build-flatpak.sh "$deb_path"

      - uses: actions/upload-artifact@v7
        with:
          name: Colemak-DH-Tutor-Linux-x86_64
          path: |
            dist/Colemak-DH-Tutor-x86_64.flatpak
            dist/Colemak-DH-Tutor-flatpak-repo.tar.gz
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-installer
      - linux-flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files were downloaded" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --draft \
              --generate-notes \
              --title "Colemak-DH Tutor $GITHUB_REF_NAME" \
              --verify-tag
          fi
