name: Desktop build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Release and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate application and tag versions
        run: python scripts/check-release.py
      - name: Frontend regression tests
        run: node --experimental-strip-types --test frontend/tests/transport.test.mjs
      - name: Audit JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r backend/requirements.txt

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm.cmd ci
          npm.cmd --prefix frontend ci
          python -m pip install -r backend/requirements-build.txt

      - name: Test Python service
        run: python -m unittest backend.test_app

      - name: Build sidecar and icons
        run: |
          npm.cmd run sidecar:windows
          npm.cmd run tauri icon frontend/public/favicon.svg

      - name: Build installer
        run: npm.cmd run tauri build -- --bundles nsis

      - name: Test packaged Python service
        run: python scripts/smoke-sidecar.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Colemak-DH-Tutor-Windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux-flatpak:
    name: Linux Flatpak repository
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          python -m pip install -r backend/requirements-build.txt

      - name: Test Python service
        run: python -m unittest backend.test_app

      - name: Build sidecar, icons, and Debian staging package
        run: |
          chmod +x scripts/build-sidecar.sh packaging/flatpak/build-flatpak.sh
          ./scripts/build-sidecar.sh
          npm run tauri icon frontend/public/favicon.svg
          npm run tauri build -- --bundles deb

      - name: Build Flatpak bundle and repository
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
          deb_path=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          ./packaging/flatpak/build-flatpak.sh "$deb_path"

      - name: Test packaged Python service
        run: python scripts/smoke-sidecar.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Colemak-DH-Tutor-Linux-x86_64
          path: |
            dist/Colemak-DH-Tutor-x86_64.flatpak
            dist/Colemak-DH-Tutor-flatpak-repo.tar.gz
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-installer
      - linux-flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          pattern: Colemak-DH-Tutor-*
          merge-multiple: true

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [[ ${#files[@]} -ne 3 ]]; then
            echo "Expected Windows installer, Flatpak bundle, and repository archive" >&2
            exit 1
          fi

          (cd release-artifacts && find . -type f -print0 | sort -z | xargs -0 sha256sum) > SHA256SUMS
          files+=(SHA256SUMS)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) != true ]]; then
              echo "Refusing to overwrite an already published release. Use a new version tag." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --draft \
              --generate-notes \
              --title "Colemak-DH Tutor $GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
