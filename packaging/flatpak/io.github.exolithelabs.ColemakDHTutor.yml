app-id: io.github.exolithelabs.ColemakDHTutor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: colemak-dh-tutor

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  - name: colemak-dh-tutor
    buildsystem: simple
    sources:
      - type: file
        path: input/colemak-dh-tutor.deb
      - type: file
        path: io.github.exolithelabs.ColemakDHTutor.metainfo.xml
      - type: file
        path: io.github.exolithelabs.ColemakDHTutor.svg
    build-commands:
      - mkdir deb-extract
      - cd deb-extract && ar -x ../colemak-dh-tutor.deb
      - tar -xf $(find deb-extract -name 'data.tar.*' -print -quit) -C deb-extract
      - cp -a deb-extract/usr/. /app/
      - desktop_file=$(find /app/share/applications -name '*.desktop' -print -quit) && sed -i 's/^Icon=.*/Icon=io.github.exolithelabs.ColemakDHTutor/' "$desktop_file" && mv "$desktop_file" /app/share/applications/io.github.exolithelabs.ColemakDHTutor.desktop
      - install -Dm644 io.github.exolithelabs.ColemakDHTutor.metainfo.xml /app/share/metainfo/io.github.exolithelabs.ColemakDHTutor.metainfo.xml
      - install -Dm644 io.github.exolithelabs.ColemakDHTutor.svg /app/share/icons/hicolor/scalable/apps/io.github.exolithelabs.ColemakDHTutor.svg
